specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Bread Financial
providerId: bread
generated: '2026-09-04'
method: searched
source: >-
  https://platform-docs.breadpayments.com/bread-developers API reference (all 181 published operations) and the developer documentation, read
  2026-09-04. Supersedes the 2026-05-04 bulk-sweep scaffold, whose tier numbers were invented
  defaults and described no Bread Financial behaviour.
created: '2026-05-04'
modified: '2026-09-04'
tags:
  - Buy Now Pay Later
  - BNPL
  - Payments
  - Rate Limiting
description: >-
  Published rate-limit posture for the BreadPay Platform API. Bread declares a 429 status on part of
  its surface but publishes no numeric limit, no window and no response headers — so a client cannot
  compute a back-off and an agent cannot self-regulate.

limit_count: 0
limits: []

signaling:
  status_on_exhaustion: 429
  declared_on:
    - listApplications
    - startApplication
    - getApplication
    - checkoutApplication
    - prepareApplication
    - checkoutInstoreApplication
  declared_on_count: 6
  total_operations: 181
  scope: Checkout domain only — no other definition declares a 429
  documented_guidance: 'The caller has exceeded the allowed request rate. Retry after a short back-off period.'
  response_headers: []
  retry_after: not published
  ratelimit_headers: not published

gaps:
  - No numeric request limit is published for any tier, key or account.
  - No Retry-After, RateLimit-Limit/Remaining/Reset or X-RateLimit-* header appears in any of the 181
    published operations, so back-off must be blind exponential.
  - 175 of 181 operations do not declare a 429 at all; whether they are unthrottled or simply
    undocumented cannot be told from the contract.

observed:
  - host: platform-docs.breadpayments.com
    note: >-
      The DOCUMENTATION host (ReadMe, behind Cloudflare) does return x-ratelimit-limit: 100 with
      x-ratelimit-remaining and x-ratelimit-reset. That is the docs site protecting itself, NOT the
      BreadPay API, and it is recorded here only so a later reader does not mistake one for the other.

maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
