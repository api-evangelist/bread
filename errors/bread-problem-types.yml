      Buyer_Phone_Invalid_Type, Request_Validation, Identity_Mismatch, Phone_Already_Exists,
      Email_Already_Exists, Buyer_Conflict, Unauthorized, Unauthenticated, Buyer_Not_Found,
      Authorized_Third_Parties_Not_Found, Contacts_Not_Found, Bankruptcies_Not_Found,
      NormalizedAddressesNotFound]
  - domain: Foundations (Auth)
    schema: AuthErrorReason
    values: [Request_Validation, Not_Found, Unauthenticated, Unauthenticated_Retry_With_PII,
      Unauthenticated_Buyer_Mismatch, Unauthenticated_Buyer_Not_Found, Invalid_Token,
      Too_Many_Code_Attempts, Too_Many_Unverified_Codes_Sent, Dependency_Unavailable, System_Failure,
      Service_Unavailable]
  - domain: Checkout (Virtual Card)
    schema: VirtualCardError.reason
    values: [Unauthorized, Request_Validation, Bad_Request, Not_Found, Unable_to_Authorize,
      Unable_to_Settle, Internal_Server_Failure]
  - domain: Program
    schema: ProgramErrorReason / ExperienceErrorReason
    values: [Unauthorized, Request_Validation, Not_Found, Internal_Server_Failure, Dependency_Unavailable]
  - domain: Servicing (Payment Agreement)
    schema: PaymentAgreementErrorReason
    values: [Servicing_PaymentAgreement_BadRequest, Servicing_PaymentAgreement_InvalidIdentity,
      Servicing_PaymentAgreement_ServerError]
  - domain: Servicing (Disclosure)
    schema: DisclosureErrorReason
    values: [RESOURCE_NOT_FOUND, RETRIEVAL_ERROR, WRITE_ERROR, SERVICE_ERROR, VALIDATION_FAILURE,
      INVARIANT_VIOLATED, SYSTEM_ERROR, POLICY_ERROR, BAD_AUTHENTICATION, NOT_AUTHORIZED, INVALID, UNKNOWN]
  - domain: Tradein
    schema: TradeinErrorReason
    values: [Tradein_BadRequest, Tradein_InvalidIdentity, Tradein_ServerError]

gaps:
  - No RFC 9457 application/problem+json representation is offered.
  - Reason codes are enumerated in the schemas but carry no per-code description or remediation text
    in the published documentation, so a client can branch on them but cannot explain them to a user.
