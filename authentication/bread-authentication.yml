docs: https://platform-docs.breadpayments.com/bread-developers/docs/api-access
provider: Bread Financial
providerId: bread
summary:
  types:
  - oauth2
  - http
  flow: client_credentials
  runtime_scheme: bearer JWT
description: >-
  BreadPay Platform authentication. Bread states plainly that its APIs use OAuth 2.0 (RFC 6749) and
  supports server-side, client-side and service-account (two-legged / client credentials) scenarios.
  The OpenAPI definitions model only the RESULT of that flow — eleven http/bearer JWT schemes and one
  http/basic scheme — so the OAuth flow itself is discoverable from the documentation, not from the
  contract, and no authorization-server metadata document is published.
flow:
  grant: client_credentials
  credential: apiKey and secret, issued per merchant
  credential_source: >-
    Bread Merchant Portal account settings; for service accounts, currently issued by the partnership
    team (partnership-growth@getbread.com) pending portal self-service.
  token_request: POST /api/auth/service/authorize (operationId authorizeService, Foundations)
  token_request_auth: HTTP Basic per RFC 7617 — base64(apiKey:secret) in the Authorization header
  token_response:
    token: jwt
    tokenExpiresAt: RFC 3339 timestamp
    tokenType: Bearer
  token_use: "Authorization: Bearer <jwt> header, per RFC 6750"
  query_string_tokens: explicitly not supported
  scope: >-
    The access token carries a `scope` parameter representing the operations it grants. Bread does not
    publish a scope inventory, so the granted set cannot be enumerated ahead of time — see
    scopes/ (absent for this reason, not for lack of looking).
  buyer_tokens: >-
    A separate buyer-facing path exists in Foundations — buyerAuthorize, BuyerLogin, refreshBuyerToken,
    exchangeBuyerToken and one-time verification codes (sendCode / verifyCode) — for consumer-facing
    experiences rather than merchant server-to-server calls.
  org_tokens: exchangeOrgToken and the org-code operations scope a token to a merchant organisation.
