client_side:
  integration_key: >-
    The browser SDK authenticates with a public `integrationKey` (data-bread-payments-key attribute or
    BreadPayments.setup), which is distinct from the server API key/secret pair and is safe to expose.
partner_sandbox:
  note: >-
    Bread Financial's separate brand-partner Partner Sandbox uses a different scheme entirely — HTTP
    Basic in `authorization` plus a `client_token` header, with source-IP allow-listing. See
    sandbox/bread-sandbox.yml.
