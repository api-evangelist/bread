    humanURL: https://developers.breadfinancial.com/
    properties:
      - url: https://developers.breadfinancial.com/
        type: Documentation
    description: >-
      The Bread Pay API enables merchants to integrate installment financing options
      into online and in-store checkout flows. Supports creating financing applications,
      retrieving loan statuses, managing transactions, and handling merchant-side
      operations for buy now pay later programs.
  - aid: bread:split-pay-api
    name: Bread SplitPay API
    tags:
      - Short-Term Financing
      - Split Payments
      - Retail
    humanURL: https://developers.breadfinancial.com/
    properties:
      - url: https://developers.breadfinancial.com/
        type: Documentation
    description: >-
      SplitPay is a short-term financing alternative for retail merchants, enabling
      customers to split purchases into manageable payments and helping retailers
      attract price-sensitive customers while increasing average transaction values.
