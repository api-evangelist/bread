        type: OpenAPI
      - url: overlays/bread-foundations-overlay.yaml
        type: Overlay
      - url: https://platform-docs.breadpayments.com/bread-developers/docs/api-access
        type: Authentication
    description: >-
      Platform foundations — service-account authorization (HTTP Basic client credentials exchanged
      for a bearer JWT), buyer login and token refresh, org-token exchange, one-time verification
      codes, org codes, and the common models shared across every other domain. 15 operations.
  - aid: bread:webhook-api
    name: BreadPay Webhook API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
      - Webhooks
      - Events
      - CloudEvents
      - Replay
    humanURL: https://platform-docs.breadpayments.com/bread-developers/reference/webhook-1-introduction
    baseURL: https://api.platform.breadpayments.com
    properties:
      - url: openapi/bread-webhook-openapi.json
        type: OpenAPI
      - url: overlays/bread-webhook-overlay.yaml
        type: Overlay
      - url: webhooks/bread-webhooks.yml
        type: Webhooks
      - url: skills/bread-subscribe-to-webhooks.md
        type: AgentSkill
    description: >-
      Self-service webhook subscription management — create, update and delete subscriptions with
      NONE, BASIC or static-bearer subscriber auth, list delivered events by status, replay failed
      events by id, fire a synthetic integration test event, and fetch the JWKs that verify the
      detached JWS signature on every delivery. Events are CloudEvents 1.0.2 over the HTTP binding.
      9 operations.
  - aid: bread:program-api
    name: BreadPay Program API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
      - Programs
      - Payment Products
      - Policies
      - Enrollment
    humanURL: https://platform-docs.breadpayments.com/bread-developers/reference/program-introduction
    baseURL: https://api.platform.breadpayments.com
    properties:
      - url: openapi/bread-program-openapi.json
        type: OpenAPI
      - url: overlays/bread-program-overlay.yaml
        type: Overlay
    description: >-
      Management of public programs, payment products and the policies that determine system
      behaviour and execution. Only one operation is published
      (getPaymentProductEnrollmentByMerchantID) against 47 component schemas, so the definition
      describes far more of the domain model than it exposes.
  - aid: bread:tradein-api
    name: BreadPay Tradein API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
