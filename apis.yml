description: >-
  Bread Financial is a technology-driven financial services company offering white-label
  buy now pay later (BNPL), installment financing, and branded credit card products
  for merchants. The platform processes $27 billion in annual sales volume for 35.6
  million active customers. Bread Pay enables merchants to embed financing options
  directly into their checkout flow for both online and in-store purchases, including
  installment plans (Bread Pay) and short-term split payment options (SplitPay).
