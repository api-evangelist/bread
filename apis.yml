description: >-
  Bread Financial is a technology-driven financial services company offering white-label buy now pay
  later (BNPL), installment financing, and branded credit card products for merchants. Its developer
  surface is the BreadPay Platform — nine first-party OpenAPI 3.0.3 definitions covering 181
  operations across Checkout, Buyer Management, Merchant Operations, Payments, Servicing, Program,
  Tradein, Foundations (auth) and Webhooks, published as downloadable JSON at
  docs.breadpayments.com/oas/v2/2.0/. Merchants embed financing into checkout with a hosted JavaScript
  SDK and Bread-rendered placements and modal, then drive the transaction lifecycle
  (PENDING/AUTHORIZED/SETTLED, refund, cancel, rescind) over the REST API. Authentication is OAuth 2.0
  client credentials exchanged for a bearer JWT; events are delivered as CloudEvents 1.0.2 signed with
  a detached JWS. The contracts are fully public; credentials require a merchant agreement.
apis:
  - aid: bread:bread-pay-api
    name: BreadPay Checkout API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
      - Installment Financing
      - Checkout
      - Payments
      - BNPL
      - Virtual Card
    humanURL: https://platform-docs.breadpayments.com/bread-developers/reference/checkout-introduction
    baseURL: https://api.platform.breadpayments.com
    properties:
      - url: openapi/bread-checkout-openapi.json
        type: OpenAPI
      - url: overlays/bread-checkout-overlay.yaml
        type: Overlay
      - url: https://platform-docs.breadpayments.com/bread-developers
        type: Documentation
      - url: https://docs.breadpayments.com/oas/v2/2.0/checkout.openapi3.json
        type: OpenAPI
    description: >-
      Checkout supports the buyer's shopping journey — starting and decisioning a financing
      application, returning personalized payment agreement options, completing checkout in-store or
      online, and issuing virtual cards into Apple Pay or Google Pay wallets. 18 operations.
  - aid: bread:split-pay-api
    name: Bread SplitPay
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
      - Short-Term Financing
      - Split Payments
      - Retail
    humanURL: https://platform-docs.breadpayments.com/bread-onboarding/docs/integration-testing
    baseURL: https://api.platform.breadpayments.com
    properties:
      - url: https://platform-docs.breadpayments.com/bread-onboarding
        type: Documentation
    description: >-
      SplitPay is Bread's short-term, card-funded split-payment product for retail merchants. It is
      delivered through the same BreadPay Platform contracts and the same hosted SDK as installment
      financing rather than through a separate API surface — Bread publishes SplitPay-specific
      integration and test guidance (test card 4000000000000002) but no SplitPay-only OpenAPI.
  - aid: bread:merchant-operations-api
    name: BreadPay Merchant Operations API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
      - Transactions
      - Settlement
      - Refunds
      - Reporting
      - Carts
    humanURL: https://platform-docs.breadpayments.com/bread-developers/reference/merchant-operations-introduction
    baseURL: https://api.platform.breadpayments.com
    properties:
      - url: openapi/bread-merchant-operations-openapi.json
        type: OpenAPI
      - url: overlays/bread-merchant-operations-overlay.yaml
        type: Overlay
      - url: skills/bread-authorize-and-settle-a-transaction.md
        type: AgentSkill
      - url: skills/bread-refund-or-cancel-a-transaction.md
        type: AgentSkill
    description: >-
      The merchant-facing transaction lifecycle — authorize, settle, refund, cancel, rescind, extend
      expiration — plus carts, fulfillment detail, and settlement/funding/targeting reporting exports.
      Transaction state changes are guarded by an ETag/If-Match revision check that answers 412 on a
      mismatch. 32 operations.
  - aid: bread:servicing-api
    name: BreadPay Servicing API
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bread.png
    tags:
      - Loan Servicing
      - Payments
      - Disclosures
      - Disputes
      - Post-Purchase
    humanURL: https://platform-docs.breadpayments.com/bread-developers/reference/servicing-1-introduction
    baseURL: https://api.platform.breadpayments.com
    properties:
      - url: openapi/bread-servicing-openapi.json
        type: OpenAPI
      - url: overlays/bread-servicing-overlay.yaml
        type: Overlay
      - url: skills/bread-take-a-payment-on-a-payment-agreement.md
        type: AgentSkill
    description: >-
      The buyer's post-purchase journey — payment agreements, balances and ledger breakdowns,
      autopay enrollment, scheduled and ad-hoc payments, refunds, fee and principal waivers, product
      disputes, deferred interest, "as low as" offers and regulatory disclosure generation. The
      largest definition at 64 operations, and the only one carrying an idempotency key.
  - aid: bread:buyer-management-api
