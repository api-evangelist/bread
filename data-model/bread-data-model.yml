    note: Top of the identity chain; present on every webhook Identity object.
  - name: Program
    domain: Program
    description: A financing programme — the payment products and policies that determine system behaviour.
    most_referenced: true
  - name: Merchant
    domain: Merchant Operations
    description: The selling party; carries locations, groups and org codes.
  - name: Buyer
    domain: Buyer Management
    description: The consumer applying for and holding financing; carries contacts, credit report data,
      authorized third parties and status.
  - name: Application
    domain: Checkout
    description: A buyer's request for financing; decisioned to APPROVED / DENIED / INELIGIBLE.
  - name: Transaction
    domain: Merchant Operations
    description: The merchant-facing purchase record; moves PENDING -> AUTHORIZED -> SETTLED, with
      refund, cancel and rescind paths. Revisioned by Etag.
  - name: Cart
    domain: Merchant Operations
    description: Pre-transaction basket; can be notified, expired or soft-deleted.
  - name: PaymentAgreement
    domain: Servicing
    description: The loan / installment agreement created at checkout — the post-purchase spine.
  - name: Payment
    domain: Payments and Servicing
    description: A money movement against a payment agreement; scheduled, pending, received, failed,
      cancelled, refunded, returned, charged back.
  - name: PaymentMethod
    domain: Payments
    description: A stored card or bank account, tokenizable via access and transient tokens.
  - name: PaymentProduct
    domain: Program
    description: The financing product (installment, card, split pay) a program enrols a merchant into.
  - name: Issuance / Card / Wallet
    domain: Checkout
    description: Virtual card issuance, Apple Pay / Google Pay provisioning and wallet retrieval.
  - name: Disclosure
    domain: Servicing
    description: Regulatory disclosure documents generated per agreement, by name or by target.
  - name: UpgradeableLoan
    domain: Tradein
    description: A loan eligible for the Apple upgrade / trade-in programme.
  - name: Subscription / EventDispatch
    domain: webhook
    description: A subscriber endpoint and the events dispatched to it, with status and replay.

