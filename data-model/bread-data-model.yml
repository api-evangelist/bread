identifier_convention:
  format: UUID (schema UUID / NullUUID)
  reference_field: <entity>ID
  example: transactionID, buyerID, paymentAgreementID, merchantID, programID, tenantID
  prefixes: none — Bread uses bare UUIDs, not typed prefixes.

tenancy:
  root: tenantID
  note: >-
    Every webhook payload and most resources carry an Identity object rooted at tenantID, then
    narrowed by programID, merchantID, locationID and groupID. Authorization is scoped by this chain —
    a merchant cannot read another merchant's transaction even knowing its id.

entities:
  - name: Tenant
