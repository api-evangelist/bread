provider: Bread Financial
providerId: bread
description: >-
  Bread Financial distributes NO client library through a public package registry. Its web SDK is a
  CDN script tag on Bread-operated hosts, and its iOS/Android SDKs are handed directly to brand
  partners in a pilot programme. Every version field below is therefore either read out of the served
  bundle or recorded as null with the reason.

registry_summary:
  npm: none — no first-party @breadfinancial / @breadpayments scope or bread-* package exists
  pypi: none
  maven_central: none found
  cocoapods: >-
    none published to the public trunk; the iOS SDK requires CocoaPods 1.16.1+ to install but is
    delivered privately (trunk.cocoapods.org/api/v1/pods/BreadPartnersSDK -> 404)
  nuget: none
  rubygems: none
  packagist: none
  crates: none
  go: none

