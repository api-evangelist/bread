generated: '2026-09-04'
method: derived
source: >-
  the nine first-party OpenAPI 3.0.3 definitions in openapi/, https://platform-docs.breadpayments.com/bread-developers/docs/api-access and
  https://platform-docs.breadpayments.com/bread-developers/docs/webhook-concepts
provider: Bread Financial
providerId: bread
description: >-
  Cross-cutting and domain standards the BreadPay Platform contract actually declares about itself.
  Every entry cites the exact place the claim is made; nothing here is inferred from marketing copy.

conformance:
  - id: openapi-3.0.3
    name: OpenAPI Specification 3.0.3
    conforms: true
    evidence: >-
      All nine definitions declare openapi 3.0.3 and are published as first-party downloads at
      https://docs.breadpayments.com/oas/v2/2.0/<domain>.openapi3.json
  - id: oauth2
    name: OAuth 2.0 (RFC 6749) — Client Credentials
    conforms: true
    evidence: >-
      https://platform-docs.breadpayments.com/bread-developers/docs/api-access states "BreadPay APIs uses OAuth 2.0 Specification (RFC 6749)" and
      documents the two-legged Client Credentials flow for service accounts, returning
      { token, tokenExpiresAt, tokenType } with a `scope` claim.
    caveat: >-
      No oauth2 securityScheme is declared in the OpenAPI files — the specs model the result as
      http/bearer — and no scope inventory or authorization-server metadata document is published, so
      the flow cannot be discovered from the contract alone.
  - id: rfc6750
    name: OAuth 2.0 Bearer Token Usage (RFC 6750)
    conforms: true
    evidence: >-
      api-access documents Authorization: Bearer <jwt> and explicitly refuses the query-string form.
      Eleven bearerAuth* securitySchemes with bearerFormat JWT across the nine definitions.
  - id: rfc7617
    name: HTTP Basic authentication (RFC 7617)
    conforms: true
    evidence: basicAuthService in openapi/bread-foundations-openapi.json; api-access cites RFC 7617 for token issuance.
  - id: cloudevents-1.0.2
    name: CloudEvents 1.0.2 — HTTP Protocol Binding
    conforms: true
    evidence: >-
      https://platform-docs.breadpayments.com/bread-developers/docs/webhook-concepts — "Webhooks are sent using the Cloud Events format with the HTTP
      protocol binding", with a worked request showing ce-id / ce-source / ce-specversion 1.0 /
      ce-type / ce-time headers.
  - id: jws-rfc7515
    name: JSON Web Signature (RFC 7515) / JOSE
    conforms: true
    evidence: >-
      Webhook deliveries carry a detached X-Jws-Signature with typ JOSE and a crit Timestamp header;
      signing keys are published at GET /api/webhook/client/jwks.
  - id: jwk-rfc7517
    name: JSON Web Key (RFC 7517)
    conforms: true
    evidence: openapi/bread-webhook-openapi.json — getClientJWKs returns a JWKList of JWK objects.
  - id: http-conditional-requests
    name: HTTP conditional requests — ETag / If-Match (RFC 9110)
    conforms: true
    evidence: >-
      openapi/bread-merchant-operations-openapi.json — getTransactionByID returns an Etag; authorize,
      settle, cancel, refund and rescind accept If-Match and answer 412 on a revision mismatch.
  - id: rfc9457
    name: RFC 9457 Problem Details for HTTP APIs
    conforms: false
    evidence: >-
      No application/problem+json media type appears in any of the 181 operations; Bread publishes a
      bespoke {reason, code, message, domain, metadata} envelope. See errors/bread-problem-types.yml.
  - id: rfc8594
    name: RFC 8594 Sunset header
    conforms: false
    evidence: >-
      Three operations carry `deprecated: true` but no Sunset or Deprecation response header and no
      deprecation policy is published. See lifecycle/bread-lifecycle.yml.
  - id: idempotency-key
    name: Idempotency-Key request header
    conforms: partial
    evidence: >-
      One operation of roughly ninety mutating operations (makePayment,
      POST /api/servicing/payment-agreement/{id}/payment) declares an optional xIdempotencyKey.
      See conventions/bread-conventions.yml.
  - id: pagination
    name: Consistent collection pagination
    conforms: true
    evidence: limit + offset + sort query parameters and a `pagination` response object across 18 list operations.
  - id: rate-limit-headers
    name: RateLimit header fields for HTTP (draft) / Retry-After
    conforms: false
    evidence: >-
      429 is declared on six Checkout operations with the guidance "Retry after a short back-off
      period", but no Retry-After, RateLimit-* or X-RateLimit-* response header is declared anywhere.

domain_standard:
  declared: false
  searched_for: [ISO 20022, FDX, EMVCo, Open Banking / PSD2, NACHA, X12, EDIFACT, OpenRTB, SCIM, OData]
  finding: >-
    The BreadPay Platform contract declares no payments- or lending-domain interchange standard. Its
    money, term, disclosure and payment-agreement models are Bread's own vocabulary. Bread does
    reference Marqeta as a card-issuing processor in a denial sub-status and returns bank identifiers
    by routing number and last-4, but neither is a declared standard conformance.
  note: >-
    Reward-only — a provider whose market standard it does not implement is not penalised here, and
    US closed-loop BNPL / private-label credit has no widely adopted contract-level interchange
    standard. CloudEvents 1.0.2, recorded above, is the strongest standards signal Bread does make.

compliance_certifications:
  published: false
  note: >-
    No trust centre, SOC 2, ISO 27001, PCI DSS or FedRAMP attestation page was found on any Bread
    Financial host (probe-security-programs.py, 2026-09-04). Bread Financial's issuing bank
    subsidiaries are federally regulated, and card data is captured inside Bread's hosted modal rather
    than by the merchant, but neither fact is a published certification and neither is claimed here.

