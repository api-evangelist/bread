  rfc8594: false
  deprecated_operations:
    - operationId: searchTransactions
      path: GET /api/transaction/search
      definition: openapi/bread-merchant-operations-openapi.json
    - operationId: getLoanHistory
      path: GET /api/reporting/report/loan-history
