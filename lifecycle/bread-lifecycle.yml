  header: X-API-VERSION
  spec_location: https://docs.breadpayments.com/oas/v2/2.0/<domain>.openapi3.json
  predecessor: >-
    A "Bread Classic" generation of the API predates the 2.0 platform; its reference lived at
    docs.breadpayments.com/bread-classic/ and the current documentation site no longer serves it.

deprecation:
