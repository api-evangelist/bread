description: >-
  Bread Financial publishes NO API plans, tiers, quotas or prices. The BreadPay Platform is not a
  self-serve developer product: access begins with a merchant financing agreement, credentials are
  issued by an integration manager through the Bread Merchant Portal, and the commercial terms are the
  financing programme's economics (merchant discount rate, promotional-financing subsidy, settlement
  terms), negotiated per merchant. There is no signup URL, no pricing page and no free tier.

plan_count: 0
plans: []

access_model:
  self_serve: false
  signup_url: null
  pricing_url: null
  onboarding: >-
    Contact Bread Financial's partnership team; an account manager issues the integrationKey and the
    API key/secret pair, retrievable from the Bread Merchant Portal account settings once the account
    exists. The Partner Sandbox additionally requires the caller's egress IP ranges to be
    allow-listed by Bread.
  contact: partnership-growth@getbread.com
  gating: >-
    The API reference itself is fully public and unauthenticated — all nine OpenAPI definitions can be
    downloaded by anyone — but no credential can be obtained without a merchant relationship.

commercial_note: >-
  Recording plan_count 0 is a measurement, not a gap in this profile: for a regulated lender the API
  is the delivery mechanism for a credit programme, and there is no per-call price to publish.

